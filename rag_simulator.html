
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Simulator — Learn by Seeing</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#62708a;--line:#dce4ef;--blue:#3569e8;--blue2:#eaf0ff;--green:#16845b;--green2:#e6f7ef;--amber:#a65b08;--amber2:#fff2dd;--purple:#7754d6;--purple2:#f0ebff;--shadow:0 10px 30px rgba(23,32,51,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{background:linear-gradient(120deg,#182c58,#3569e8);color:#fff;padding:28px 20px 24px}header .wrap{max-width:1100px;margin:auto}h1{font-size:clamp(25px,4vw,36px);margin:0 0 7px;letter-spacing:-.7px}header p{margin:0;color:#dce6ff;max-width:720px}
main{max-width:1100px;margin:22px auto;padding:0 16px 36px}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
.panel,.stage,.sidebox{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.panel{padding:16px;position:sticky;top:14px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.3px;color:var(--muted);text-transform:uppercase}.steps{list-style:none;padding:0;margin:12px 0 18px}.steps button{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:0;background:transparent;padding:10px 8px;border-radius:10px;color:var(--muted);cursor:pointer;font:inherit}.steps button.active{background:var(--blue2);color:var(--blue);font-weight:750}.num{width:27px;height:27px;flex:0 0 27px;display:grid;place-items:center;border-radius:50%;background:#edf1f7;font-size:12px;font-weight:800}.active .num{background:var(--blue);color:white}.done .num{background:var(--green2);color:var(--green)}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:118px;resize:vertical}input[type=range]{padding:0;accent-color:var(--blue)}.small{font-size:12px;color:var(--muted)}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:750;padding:10px 14px;cursor:pointer}.btn.secondary{background:#eef2f8;color:var(--ink)}.btn:disabled{opacity:.4;cursor:not-allowed}
.stage{padding:22px;min-height:460px}.stagehead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.stage h2{margin:2px 0 4px;font-size:25px;letter-spacing:-.5px}.stage p{margin:0;color:var(--muted)}.pill{font-size:12px;border-radius:100px;padding:5px 10px;font-weight:800;white-space:nowrap;background:var(--blue2);color:var(--blue)}.visual{border:1px solid var(--line);background:#f9fbff;border-radius:14px;padding:15px;margin:16px 0}.flow{display:flex;align-items:stretch;gap:9px;flex-wrap:wrap}.node{flex:1 1 135px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px;min-width:0}.node b{display:block;font-size:13px;margin-bottom:4px}.node span{font-size:12px;color:var(--muted)}.arrow{align-self:center;color:#93a1b7;font-size:21px;font-weight:800}.tag{display:inline-block;border-radius:7px;padding:3px 7px;margin:3px 3px 0 0;font-size:11px;font-weight:750;background:var(--blue2);color:var(--blue)}.tag.green{background:var(--green2);color:var(--green)}.tag.amber{background:var(--amber2);color:var(--amber)}.tag.purple{background:var(--purple2);color:var(--purple)}
.docgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.doc{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.doc h3{font-size:13px;margin:0 0 6px}.doc p{font-size:13px;color:var(--ink);margin:0}.chunklist{display:grid;gap:9px}.chunk{border:1px solid var(--line);border-left:4px solid var(--purple);background:#fff;border-radius:9px;padding:11px}.chunk.selected{border-color:var(--green);border-left-color:var(--green);background:#f2fcf7}.chunk .meta{font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:750}.chunk p{font-size:13px;color:var(--ink);margin:0}.scorebar{height:7px;background:#edf1f7;border-radius:10px;overflow:hidden;margin-top:8px}.scorebar i{display:block;height:100%;background:var(--blue);border-radius:10px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.note{border-radius:11px;padding:12px;background:var(--blue2);color:#23458f;font-size:13px;margin-top:12px}.note.warn{background:var(--amber2);color:#7c470b}.note.good{background:var(--green2);color:#116844}.quiz{border:1px solid var(--line);padding:14px;border-radius:12px;margin-top:15px}.quiz button{display:block;width:100%;text-align:left;margin-top:7px;background:#fff;border:1px solid var(--line);padding:9px;border-radius:8px;cursor:pointer;color:var(--ink)}.quiz button:hover{border-color:var(--blue)}.footer-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.hidden{display:none!important}.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}.kpi div{background:#f3f6fb;border-radius:10px;padding:11px}.kpi strong{display:block;font-size:20px}.kpi span{font-size:11px;color:var(--muted)}
@media(max-width:760px){.layout{grid-template-columns:1fr}.panel{position:static}.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px}.stage{padding:16px}.docgrid,.twocol{grid-template-columns:1fr}.arrow{transform:rotate(90deg);width:100%;text-align:center}.stagehead{display:block}.pill{display:inline-block;margin-top:10px}.kpi{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="wrap"><h1>RAG Simulator</h1><p>Follow a question from raw documents to a grounded answer. Change the query, inspect chunks, and see how retrieval choices can help—or fail.</p></div></header>
<main>
<div class="layout">
<aside class="panel">
<div class="eyebrow">Learning path</div>
<ul class="steps" id="steps">
<li><button class="active" data-step="0"><span class="num">1</span><span>Documents</span></button></li>
<li><button data-step="1"><span class="num">2</span><span>Chunking</span></button></li>
<li><button data-step="2"><span class="num">3</span><span>Embeddings</span></button></li>
<li><button data-step="3"><span class="num">4</span><span>Vector store</span></button></li>
<li><button data-step="4"><span class="num">5</span><span>User query</span></button></li>
<li><button data-step="5"><span class="num">6</span><span>Retrieval</span></button></li>
<li><button data-step="6"><span class="num">7</span><span>LLM answer</span></button></li>
<li><button data-step="7"><span class="num">8</span><span>Failure lab</span></button></li>
</ul>
<div class="eyebrow">Try your own query</div>
<label for="query">Ask the knowledge base</label>
<input id="query" value="How many casual leaves can I take?" />
<div class="small" style="margin-top:6px">Demo knowledge base: a fictional company leave policy. No external services or APIs are used.</div>
<div class="btnrow"><button class="btn" id="run">Run RAG demo</button><button class="btn secondary" id="reset">Reset</button></div>
</aside>
<section class="stage">
<div id="stageContent"></div>
<div class="footer-nav"><button class="btn secondary" id="prev">← Previous</button><button class="btn" id="next">Next step →</button></div>
</section>
</div>
</main>
<script>
const docs=[
{title:"Leave Policy — Time Off",text:"Employees receive 12 casual leave days per calendar year. Casual leave should normally be requested at least one working day in advance. Unused casual leave does not carry forward to the next year.",source:"leave-policy.pdf"},
{title:"Leave Policy — Sick Leave",text:"Employees receive 10 sick leave days per calendar year. For an absence of more than two consecutive working days, a medical certificate may be requested by HR.",source:"leave-policy.pdf"},
{title:"Leave Policy — Approval",text:"Leave requests must be submitted through the HR portal. The employee's manager approves or declines the request based on team coverage and business needs.",source:"leave-policy.pdf"},
{title:"Travel & Expenses",text:"Business travel must be approved before booking. Employees should submit expense claims with receipts within 30 days of the trip.",source:"travel-expenses.pdf"}
];
let step=0,chunkSize=24,topK=3,results=[],chunks=[];
const $=id=>document.getElementById(id);
function splitChunks(){
 chunks=[];
 docs.forEach((d,di)=>{
   const sentences=d.text.match(/[^.!?]+[.!?]*/g)||[d.text];
   let current="";
   sentences.forEach(s=>{
     s=s.trim(); if(!s)return;
     if((current+" "+s).trim().split(/\s+/).length>chunkSize && current){chunks.push({id:"C"+(chunks.length+1),text:current,source:d.source,title:d.title,doc:di});current=s;}
     else current=(current+" "+s).trim();
   });
   if(current)chunks.push({id:"C"+(chunks.length+1),text:current,source:d.source,title:d.title,doc:di});
 });
}
function tokens(s){return (s.toLowerCase().match(/[a-z0-9]+/g)||[]).filter(x=>!["the","a","an","is","i","can","do","how","many","what","to","of","for","and","my","me","it","in","per"].includes(x))}
function score(query,text){
 const q=tokens(query), t=tokens(text); if(!q.length||!t.length)return 0;
 const unique=[...new Set(q)];let hit=0;
 unique.forEach(w=>{if(t.includes(w))hit++});
 // A simple lexical-overlap score for teaching; not a real embedding model.
 return Math.round(100*hit/unique.length);
}
function retrieve(){
 const q=$("query").value.trim();
 results=chunks.map(c=>({...c,score:score(q,c.text)})).sort((a,b)=>b.score-a.score).slice(0,topK);
}
function render(){
 document.querySelectorAll("#steps button").forEach((b,i)=>{b.classList.toggle("active",i===step);b.classList.toggle("done",i<step)});
 $("prev").disabled=step===0;$("next").textContent=step===7?"Start again ↺":"Next step →";
 const q=$("query").value.trim();
 const relevant=results.filter(r=>r.score>0);
 const best=relevant[0];
 const views=[
`<div class="stagehead"><div><div class="eyebrow">Step 1 · Ingestion</div><h2>Start with source documents</h2><p>RAG needs a knowledge source before a user asks anything.</p></div><span class="pill">Preparation time</span></div>
<div class="docgrid">${docs.map(d=>`<div class="doc"><h3>📄 ${d.title}</h3><p>${d.text}</p><div class="tag">${d.source}</div></div>`).join("")}</div>
<div class="note"><b>What happens in a real system?</b> Files are parsed into text; metadata such as file name, page number, and access permissions may be retained. Scanned PDFs may need OCR.</div>`,
`<div class="stagehead"><div><div class="eyebrow">Step 2 · Chunking</div><h2>Split documents into chunks</h2><p>Smaller passages are easier to retrieve than an entire long document.</p></div><span class="pill">Preparation time</span></div>
<label for="chunkSize">Chunk size (approximate words per chunk): <b id="chunkVal">${chunkSize}</b></label><input id="chunkSize" type="range" min="10" max="45" value="${chunkSize}" step="5">
<div class="chunklist" style="margin-top:14px">${chunks.map(c=>`<div class="chunk"><div class="meta">${c.id} · ${c.source}</div><p>${c.text}</p></div>`).join("")}</div>
<div class="note"><b>Trade-off:</b> Tiny chunks can lose context; huge chunks can contain distracting information. Overlap between adjacent chunks can preserve meaning across boundaries.</div>`,
`<div class="stagehead"><div><div class="eyebrow">Step 3 · Embedding</div><h2>Represent meaning as vectors</h2><p>An embedding model converts each chunk into a list of numbers.</p></div><span class="pill">Preparation time</span></div>
<div class="visual"><div class="flow"><div class="node"><b>Text chunk</b><span>“Employees receive 12 casual leave days…”</span></div><div class="arrow">→</div><div class="node"><b>Embedding model</b><span>Maps text to a numeric vector</span></div><div class="arrow">→</div><div class="node"><b>Vector</b><span>[0.12, −0.08, 0.74, …]</span></div></div></div>
<div class="twocol"><div class="sidebox" style="padding:13px"><b>Similar meaning</b><p style="font-size:13px">“casual leave allowance” may be close to “casual leave days” even if wording differs.</p><span class="tag green">High semantic similarity</span></div><div class="sidebox" style="padding:13px"><b>Not magic</b><p style="font-size:13px">Vectors don't guarantee truth or relevance. Quality depends on the embedding model and text.</p><span class="tag amber">Model-dependent</span></div></div>
<div class="note">This simulator uses word overlap for its live scoring—not a real embedding model. The vector shown is illustrative only.</div>`,
`<div class="stagehead"><div><div class="eyebrow">Step 4 · Indexing</div><h2>Store chunks and vectors</h2><p>A vector database makes it efficient to find similar chunks later.</p></div><span class="pill">Preparation time</span></div>
<div class="visual"><div class="flow"><div class="node"><b>${chunks.length} chunks</b><span>Text + source metadata</span></div><div class="arrow">→</div><div class="node"><b>Vector index</b><span>Numerical representations</span></div><div class="arrow">→</div><div class="node"><b>Searchable store</b><span>Similarity search + filters</span></div></div></div>
<div class="kpi"><div><strong>${docs.length}</strong><span>Source documents</span></div><div><strong>${chunks.length}</strong><span>Chunks created</span></div><div><strong>1</strong><span>Illustrative index</span></div></div>
<div class="note">A real vector store often keeps both the embedding and the original chunk text (or a pointer to it), plus metadata. Keyword search and vector search can also be combined (hybrid retrieval).</div>`,
`<div class="stagehead"><div><div class="eyebrow">Step 5 · Query</div><h2>Turn the question into a search</h2><p>The user query is processed in a way compatible with document retrieval.</p></div><span class="pill">Query time</span></div>
<div class="visual"><label for="query2">Your question</label><input id="query2" value="${escapeHtml(q)}"><div class="flow" style="margin-top:12px"><div class="node"><b>Raw question</b><span>${escapeHtml(q||"Type a question")}</span></div><div class="arrow">→</div><div class="node"><b>Query representation</b><span>In a real system: embedding, keywords, or both</span></div></div></div>
<div class="note">The question is not usually appended to every document. Instead, the system uses it to search the indexed chunks, then passes the best matches onward.</div>`,
`<div class="stagehead"><div><div class="eyebrow">Step 6 · Retrieval</div><h2>Find the most relevant chunks</h2><p>Results are ranked, then the top results are selected for context.</p></div><span class="pill">Query time</span></div>
<label for="topK">Number of chunks to retrieve (top‑K): <b id="kVal">${topK}</b></label><input id="topK" type="range" min="1" max="${Math.min(6,chunks.length)}" value="${topK}">
<div class="chunklist" style="margin-top:14px">${results.map((r,i)=>`<div class="chunk ${r.score>0?'selected':''}"><div class="meta">${i+1}. ${r.id} · ${r.source} <span style="float:right">Demo overlap score: ${r.score}%</span></div><p>${r.text}</p><div class="scorebar"><i style="width:${r.score}%"></i></div></div>`).join("")}</div>
<div class="note warn"><b>Important:</b> The displayed score is simple keyword overlap to make ranking visible. Real semantic retrieval commonly compares query and chunk embeddings using cosine similarity or another distance measure.</div>`,
`<div class="stagehead"><div><div class="eyebrow">Step 7 · Generation</div><h2>Give retrieved context to the LLM</h2><p>The model receives the question plus selected passages and produces a response.</p></div><span class="pill">Query time</span></div>
<div class="visual"><div class="flow"><div class="node"><b>User question</b><span>${escapeHtml(q||"No question entered")}</span></div><div class="arrow">+</div><div class="node"><b>Retrieved context</b><span>${relevant.length?relevant.slice(0,topK).length+" matching chunk(s)":"No matching chunks"}</span></div><div class="arrow">→</div><div class="node"><b>LLM</b><span>Follow instructions and use evidence</span></div></div></div>
<div class="sidebox" style="padding:15px"><div class="eyebrow">Illustrative grounded answer</div><p style="color:var(--ink);margin:8px 0">${answer(q,relevant)}</p><div class="small">This is a rule-based demonstration, not a live LLM response. A production system should cite source passages and admit when context is insufficient.</div></div>
<div class="note good"><b>Key idea:</b> RAG supplies external context at answer time; it does not retrain the model on these documents.</div>`,
`<div class="stagehead"><div><div class="eyebrow">Step 8 · Failure lab</div><h2>See where RAG can fail</h2><p>Change your question and observe how retrieval changes.</p></div><span class="pill">Experiment</span></div>
<div class="quiz"><b>Experiment A: Ask something missing from the documents</b><p class="small">Try “What is the parental leave policy?” or “What is the office Wi‑Fi password?”</p><button data-q="What is the parental leave policy?">Try: parental leave policy</button><button data-q="What is the office Wi-Fi password?">Try: office Wi-Fi password</button></div>
<div class="quiz"><b>Experiment B: Think about the failure</b><button class="answerReveal">Why can RAG give a wrong answer even when the answer exists?</button><div id="failureAnswer" class="note hidden">The correct chunk may not be retrieved (poor chunk boundaries, weak embeddings, wrong top‑K, filters, or wording mismatch). The LLM may also misread context or answer beyond the evidence. Better retrieval, reranking, citations, and an “I don't know” policy can help.</div></div>
<div class="note warn"><b>Failure modes to remember:</b> bad parsing · poor chunking · retrieval misses · irrelevant chunks · context overflow · hallucination · stale documents · missing permissions checks.</div>`
 ];
 $("stageContent").innerHTML=views[step];
 $("steps").querySelectorAll("button").forEach(b=>b.onclick=()=>{step=+b.dataset.step;render()});
 if(step===1){$("chunkSize").oninput=e=>{chunkSize=+e.target.value;splitChunks();render()}}
 if(step===4){$("query2").oninput=e=>{$("query").value=e.target.value;retrieve();render()}}
 if(step===5){$("topK").oninput=e=>{topK=+e.target.value;$("kVal").textContent=topK;retrieve();render()}}
 document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{$("query").value=b.dataset.q;retrieve();render()});
 const reveal=document.querySelector(".answerReveal");if(reveal)reveal.onclick=()=> $("failureAnswer").classList.toggle("hidden");
}
function answer(q,rel){
 const s=q.toLowerCase();
 if(!rel.length)return "I couldn't find a clearly matching passage in the retrieved context. A reliable RAG app should avoid guessing and say that the available documents don't provide enough information.";
 if(s.includes("casual")||s.includes("leave days")||s.includes("time off")){
  const c=rel.find(x=>x.text.toLowerCase().includes("casual leave"));
  if(c)return "The policy says employees receive 12 casual leave days per calendar year. The request should normally be made at least one working day in advance. (Source: "+c.source+")";
 }
 if(s.includes("sick")){const c=rel.find(x=>x.text.toLowerCase().includes("sick leave"));if(c)return "Employees receive 10 sick leave days per calendar year. HR may request a medical certificate for absences longer than two consecutive working days. (Source: "+c.source+")"}
 if(s.includes("expense")||s.includes("travel")){const c=rel.find(x=>x.text.toLowerCase().includes("business travel"));if(c)return "Business travel must be approved before booking, and expense claims with receipts should be submitted within 30 days. (Source: "+c.source+")"}
 return "The retrieved context contains: “"+rel[0].text+"” Source: "+rel[0].source+". Check whether this passage fully answers the question before trusting the response.";
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("run").onclick=()=>{retrieve();step=4;render()};
$("reset").onclick=()=>{$("query").value="How many casual leaves can I take?";chunkSize=24;topK=3;splitChunks();retrieve();step=0;render()};
$("prev").onclick=()=>{step=Math.max(0,step-1);render()};
$("next").onclick=()=>{step=step===7?0:Math.min(7,step+1);render()};
$("query").addEventListener("input",()=>{retrieve();if(step===5||step===6)render()});
splitChunks();retrieve();render();
</script>
</body>
</html>
